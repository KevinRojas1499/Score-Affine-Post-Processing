[project]
name = "affine-score"
version = "0.1.0"
description = "Affine post-processing of Monte Carlo score estimators for diffusion-based sampling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "pot<0.9.5",
    "torch>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affine_score"]
